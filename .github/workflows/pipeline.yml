
name: monthly-pipeline
on:
  push:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to process (YYYY-MM)"
        default: "2011-11"
jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      PIPELINE_MONTH: ${{ inputs.month || '2011-11' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev libfribidi-dev libglpk-dev libharfbuzz-dev libjpeg-dev libpng-dev libtiff-dev libuv1-dev libwebp-dev libx11-dev libgit2-dev pandoc

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Run the pipeline
        run: Rscript -e "targets::tar_make()"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-outputs
          path: outputs/```